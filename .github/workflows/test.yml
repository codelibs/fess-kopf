name: Test

on:
  push:
    branches: [ main, master, develop, 'claude/**' ]
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Run tests with coverage
      run: npm run test:coverage

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    # vue-tsc, not tsc: type errors inside .vue single-file components are
    # invisible to the bundler, which strips types without checking them.
    - name: Type-check the Vue app
      run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: _site/
        retention-days: 7

    # Runs after the upload so a failure here still leaves the freshly
    # built _site downloadable to diff against the committed one.
    # git status, not git diff: diff only reports tracked files, and a new
    # emitted file would land untracked and slip past a diff-based check.
    - name: Verify _site is in sync with src
      run: |
        if [ -n "$(git status --porcelain -- _site)" ]; then
          git status --porcelain -- _site
          git diff -- _site
          echo "::error::_site is out of date. Run 'npm run build' and commit _site."
          exit 1
        fi
